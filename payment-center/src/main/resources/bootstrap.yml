server:
  port: 27001
spring:
  project:
    info:
      version: @project.version@
  application:
    name: @artifactId@
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:}:${NACOS_PORT:}
        username: nacos
        password: nacos
        namespace: ${NACOS_NAMESPACE:}
        ip: ${NACOS_IP:}
      config:
        server-addr: ${spring.cloud.nacos.discovery.server-addr}
        file-extension: yml
        shared-configs:
          - application.${spring.cloud.nacos.config.file-extension}
        username: ${spring.cloud.nacos.discovery.username}
        password: ${spring.cloud.nacos.discovery.password}
        namespace: ${spring.cloud.nacos.discovery.namespace}
  main:
    allow-bean-definition-overriding: true
pay:
  client: 192.168.137.160
  server: 192.168.137.208

auth:
  application-name: @artifactId@
  system:
    apply-allowed-url: http://oauth-system/authorization/apply/ignore
    auth-url:
      - "/system/**"
    auth-config:
      payment-center-platform:
        secret-key: cGF5bWVudC1jZW50ZXItcGxhdGZvcm0=
        by-package:
          - com.baosight.payment.system.controller.system
          - com.baosight.payment.mch.controller.system
          - com.baosight.payment.isv.controller.system
      saas-platform:
        secret-key: ND1Q0NA==
        by-package:
          - com.baosight.payment.system.controller.system
