<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本地订单测试</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a2980, #26d0ce);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 700px;
            padding: 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .container:before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0) 70%);
            transform: rotate(30deg);
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 2.5rem;
            position: relative;
            z-index: 2;
        }

        .subtitle {
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 1.1rem;
            position: relative;
            z-index: 2;
        }

        .url-info {
            background: linear-gradient(to right, #3498db, #2c3e50);
            color: white;
            border-radius: 15px;
            padding: 25px;
            margin: 30px 0;
            text-align: center;
            position: relative;
            z-index: 2;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .url-info p {
            margin: 10px 0;
            font-size: 1.1rem;
        }

        .param-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin: 15px 0;
        }

        .param-box {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 15px;
            min-width: 180px;
        }

        .param-label {
            font-size: 1rem;
            margin-bottom: 8px;
            opacity: 0.9;
        }

        .param-value {
            font-size: 1.5rem;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            word-break: break-all;
        }

        .btn {
            background: linear-gradient(to right, #ff416c, #ff4b2b);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 18px 50px;
            font-size: 1.3rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 20px 0;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 2;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.4);
        }

        .btn:active {
            transform: translateY(2px);
        }

        .btn i {
            font-size: 1.5rem;
        }

        .request-details {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            margin: 30px 0;
            text-align: left;
            position: relative;
            z-index: 2;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .request-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            color: #2c3e50;
            font-size: 1.3rem;
        }

        .request-title i {
            color: #3498db;
        }

        .request-info {
            margin: 15px 0;
        }

        .request-info label {
            display: block;
            font-weight: bold;
            color: #7f8c8d;
            margin-bottom: 5px;
            font-size: 0.95rem;
        }

        .request-info pre {
            background: #e8f4fc;
            border-radius: 8px;
            padding: 15px;
            font-size: 1rem;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .result-container {
            background: #e8f4fc;
            border-radius: 15px;
            padding: 25px;
            margin-top: 25px;
            min-height: 150px;
            text-align: left;
            position: relative;
            z-index: 2;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .result-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            color: #2c3e50;
        }

        .result-content {
            background: white;
            border-radius: 8px;
            padding: 15px;
            min-height: 100px;
        }

        .result-content pre {
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 1rem;
            line-height: 1.5;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }

        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            border-top: 4px solid #3498db;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .status {
            margin-top: 15px;
            font-weight: 600;
            font-size: 1.1rem;
            padding: 10px;
            border-radius: 8px;
            display: none;
        }

        .success {
            background-color: rgba(46, 204, 113, 0.2);
            color: #27ae60;
            border: 1px solid #27ae60;
        }

        .error {
            background-color: rgba(231, 76, 60, 0.2);
            color: #c0392b;
            border: 1px solid #c0392b;
        }

        .footer {
            margin-top: 25px;
            color: #7f8c8d;
            font-size: 0.9rem;
            position: relative;
            z-index: 2;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 2rem;
            }

            .param-container {
                flex-direction: column;
                align-items: center;
            }

            .param-box {
                width: 100%;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1><i class="fas fa-paper-plane"></i>本地支付测试</h1>
    <p class="subtitle">模拟支付</p>

    <div class="url-info">
        <p>从URL参数中获取的值：</p>
        <div class="param-container">
            <div class="param-box">
                <div class="param-label">IP地址</div>
                <div class="param-value" id="ipValue">未获取</div>
            </div>
            <div class="param-box">
                <div class="param-label">金额</div>
                <div class="param-value" id="amountValue">未获取</div>
            </div>
            <div class="param-box">
                <div class="param-label">订单号</div>
                <div class="param-value" id="orderId">未获取</div>
            </div>


        </div>
    </div>

    <button class="btn" onclick="sendPostRequest()">
        <i class="fas fa-paper-plane"></i> 支付
    </button>

    <div class="request-details">
        <div class="request-title">
            <i class="fas fa-info-circle"></i>
            <h3>请求详情</h3>
        </div>

        <div class="request-info">
            <label>请求URL:</label>
            <pre id="requestUrl">等待发送请求...</pre>
        </div>

        <div class="request-info">
            <label>请求体 (JSON):</label>
            <pre id="requestBody">等待发送请求...</pre>
        </div>
    </div>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>正在发送请求，请稍候...</p>
    </div>

    <div class="status" id="status"></div>

    <div class="result-container">
        <div class="result-title">
            <i class="fas fa-list-alt"></i>
            <h3>API响应结果</h3>
        </div>
        <div class="result-content">
            <pre id="apiResult">返回结果信息</pre>
        </div>
    </div>

    <div class="footer">
        <p>模拟支付</p>
    </div>
</div>

<script>
    // 获取URL参数
    function getUrlParams() {
        const params = new URLSearchParams(window.location.search);
        return {
            ip: params.get('ip') || '未指定',
            amount: params.get('amount') || '0',
            orderId: params.get('orderId') || '0'
        };
    }

    // 更新页面显示的参数值
    function updateParamsDisplay() {
        const params = getUrlParams();
        document.getElementById('ipValue').textContent = params.ip;
        document.getElementById('amountValue').textContent = params.amount;
        document.getElementById('orderId').textContent = params.orderId;
    }

    // 发送POST请求
    function sendPostRequest() {
        const params = getUrlParams();
        const loadingElement = document.getElementById('loading');
        const statusElement = document.getElementById('status');
        const resultElement = document.getElementById('apiResult');
        const requestUrlElement = document.getElementById('requestUrl');
        const requestBodyElement = document.getElementById('requestBody');

        // 显示加载状态
        loadingElement.style.display = 'block';
        statusElement.style.display = 'none';
        statusElement.className = 'status';

        const apiUrl = `http://${params.ip}:9000/pay/notice/api/pay/notify/tl_pay`;
        const requestBody = {
            bizData: {
                result: 2,
                reqTraceNum: params.orderId,
                respTraceNum: getMilliseconds() + '' + 123,
                finishTime: getMilliseconds(),
                receiverSignNum: "dev"
            },
            transCode: '2085',
            amount: params.amount,
            timestamp: new Date().toISOString(),
            transactionId: 'TX' + Math.floor(Math.random() * 1000000)
        };

        const headers = {
            'Content-Type': 'application/json'
        };
        // 发送POST请求
        fetch(apiUrl, {
            method: 'POST',
            headers: headers,
            body: JSON.stringify(requestBody)
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP错误! 状态码: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                resultElement.textContent = JSON.stringify(data, null, 2);
                statusElement.textContent = '请求发送成功';
                statusElement.classList.add('success');
            })
            .catch(error => {
                resultElement.textContent = `错误: ${error.message}`;
                statusElement.textContent = '❌ POST请求失败';
                statusElement.classList.add('error');
            })
            .finally(() => {
                loadingElement.style.display = 'none';
                statusElement.style.display = 'block';
            });
    }

    function getMilliseconds() {
        const timestamp = Date.now();
        document.getElementById('currentTimestamp').textContent = timestamp;
        document.getElementById('timestampInput').value = timestamp;
    }

    // 初始化页面
    document.addEventListener('DOMContentLoaded', () => {
        updateParamsDisplay();
    });
</script>
</body>
</html>
